name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compila APK Android (Fire TV Deck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Codice
        uses: actions/checkout@v4

      - name: Configurazione Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          build-root-directory: android-project

      - name: Compila APK Debug con Gradle
        run: |
          cd android-project
          gradle assembleDebug --stacktrace --no-daemon

      - name: Carica APK come Artefatto Scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: FireTvDeck-app-debug
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 14
